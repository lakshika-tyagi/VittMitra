version: '3.8'

services:
  # Database Service (PostgreSQL 15 + PostGIS 3.3)
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: vittmitra_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vittmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vittmitra_password}
      POSTGRES_DB: ${POSTGRES_DB:-vittmitra_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vittmitra_user} -d ${POSTGRES_DB:-vittmitra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vittmitra_network
    restart: unless-stopped

  # Backend Service (FastAPI + SQLAlchemy + Grounded AI Orchestrator)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vittmitra_backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vittmitra_user}:${POSTGRES_PASSWORD:-vittmitra_password}@database:5432/${POSTGRES_DB:-vittmitra_db}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-to-a-secure-random-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.35}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vittmitra_network
    restart: unless-stopped

  # Frontend Service (Next.js 14 App Router)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vittmitra_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-VittMitra}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vittmitra_network
    restart: unless-stopped

networks:
  vittmitra_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
